version: 1
tasks:
  - id: TASK-0001
    title: Establish repository baseline and specification CI
    status: complete
    dependencies: []
    inputs:
      - AGENTS.md
      - specs/00_constitution/engineering_constitution.md
      - specs/09_cicd/delivery_pipeline.md
      - specs/12_testing/test_strategy.md
    acceptance:
      - Validators run locally and in pull requests
      - Branch protection and CODEOWNERS requirements are documented
      - Dependency, secret, contract, and documentation checks have pinned tooling
      - CI produces an evidence summary and fails closed
  - id: TASK-0002
    title: Implement identity, organization, tenant, and environment foundation
    status: complete
    dependencies: [TASK-0001]
  - id: TASK-0003
    title: Implement registry generator and canonical transaction contract
    status: complete
    dependencies: [TASK-0001, TASK-0002]
  - id: TASK-0004
    title: Implement raw evidence intake and quarantine
    status: complete
    dependencies: [TASK-0002, TASK-0003]
  - id: TASK-0005
    title: Implement connector-to-canonical transaction vertical slice
    status: complete
    dependencies: [TASK-0004]
  - id: TASK-0006
    title: Implement OpenSearch projection, reconciliation, and search API
    status: complete
    dependencies: [TASK-0005]
  - id: TASK-0007
    title: Implement customer console transaction search workbench
    status: complete
    dependencies: [TASK-0006]
  - id: TASK-0008
    title: Implement governed context and cited read-only chat
    status: complete
    dependencies: [TASK-0006]
  - id: TASK-0009
    title: Implement policy, durable workflow, and approval foundations
    status: complete
    dependencies: [TASK-0002]
  - id: TASK-0010
    title: Implement read-only admin health and tenant explorer
    status: complete
    dependencies: [TASK-0002, TASK-0006]
  - id: TASK-0011
    title: Execute production hardening and v1 release rehearsal
    status: complete
    dependencies: [TASK-0001, TASK-0002, TASK-0003, TASK-0004, TASK-0005, TASK-0006, TASK-0007, TASK-0008, TASK-0009, TASK-0010]
    acceptance:
      - Replace in-memory reference seams with PostgreSQL, outbox, and durable checkpoint adapters
      - Rehearse security, recovery, performance, migration, and release evidence gates
      - Verify production configuration and deployment readiness without using real customer data or credentials
  - id: TASK-0012
    title: Implement PostgreSQL persistence, migrations, and tenant-isolation adapters
    status: complete
    dependencies: [TASK-0011]
    acceptance:
      - PostgreSQL repositories and migrations replace reference Map seams behind the production composition root
      - RLS, transaction, rollback, and cross-tenant negative tests execute against a disposable PostgreSQL target when available
      - Synthetic fixtures only; missing database/configuration fails closed
  - id: TASK-0013
    title: Implement transactional outbox, durable checkpoints, and recovery workers
    status: complete
    dependencies: [TASK-0012]
    acceptance:
      - Outbox append/claim/ack/fail, retry ownership, idempotency, monotonic checkpoints, replay, and reconciliation are durable
      - Recovery and failure-injection tests prove no dual-write loss or cross-tenant leakage
  - id: TASK-0014
    title: Execute real migration, security, recovery, and load rehearsals
    status: complete
    dependencies: [TASK-0013]
    acceptance:
      - Disposable PostgreSQL migration expand/contract, restore/recovery, tenant-isolation, vulnerability, and environment-sized load/soak evidence passes
      - Results are reproducible, synthetic-only, and fail closed on missing prerequisites
  - id: TASK-0015
    title: Build immutable release, deployment, configuration, and rollback evidence
    status: complete
    dependencies: [TASK-0014]
    acceptance:
      - Signed immutable artifact manifest, SBOM/provenance, managed-secret/config checks, canary gates, rollback, and corrective-forward procedures are verified
      - No deployment occurs without explicit external approval and credentials
  - id: TASK-0016
    title: Produce controlled pilot authorization and SOC 2 readiness evidence
    status: complete
    dependencies: [TASK-0015]
    acceptance:
      - Control library, access/change/recovery/security evidence, pilot runbook, SLOs, incident process, and go/no-go record are complete
      - Pilot readiness is documented without claiming production launch, certification, or attestation
  - id: TASK-0017
    title: Complete native PostgreSQL backup, restore, and pilot evidence run
    status: complete
    dependencies: [TASK-0016]
    acceptance:
      - Native pg_dump/pg_restore or an approved equivalent executes against disposable PostgreSQL targets
      - Migration, RLS, backup/restore, outbox replay, recovery, and environment-sized load evidence is retained and reproducible
      - Missing tools/targets fail closed; no production or customer data is used
  - id: TASK-0018
    title: Integrate managed signing, secrets, and deployment environment controls
    status: complete
    dependencies: [TASK-0017]
    acceptance:
      - Managed signing/secrets references, rotation, configuration validation, and protected environment gates are verified
      - No secrets are committed or exposed; deployment remains approval-gated
  - id: TASK-0019
    title: Rehearse canary cell rollout, observability, and incident response
    status: complete
    dependencies: [TASK-0018]
    acceptance:
      - Canary promotion/rollback, SLO health gates, tenant-aware telemetry, alerting, backup recovery, and incident drills produce evidence
      - Corrective-forward behavior is verified without irreversible production mutation
  - id: TASK-0020
    title: Assemble formal controlled-pilot go/no-go authorization package
    status: complete
    dependencies: [TASK-0019]
    acceptance:
      - Pilot scope, owners, approvals, risks, SLOs, controls, evidence index, rollback plan, and explicit go/no-go decision are complete
      - No production launch, certification, or attestation is claimed without external approval
  - id: TASK-0021
    title: Build API-backed admin console foundation
    status: complete
    dependencies: [TASK-0020]
    acceptance:
      - Accessible dashboard, tenant explorer, and platform health views use documented admin APIs only
      - Support-session, authorization, redaction, and fail-closed error behavior are covered by synthetic tests
      - No production data, credentials, or privileged mutation is introduced
  - id: TASK-0022
    title: Complete operational admin modules and managed integration visibility
    status: complete
    dependencies: [TASK-0021]
    acceptance:
      - Admin console covers operations, releases, incidents, audit, data quality, ingestion, workflows, policies, and compliance visibility
      - Managed observability, deployment, and backup/recovery status is API-backed, redacted, tenant/environment scoped, and fail-closed
      - Privileged operations remain approval-gated and no unsupported production authorization is claimed
  - id: TASK-0023
    title: Implement approval-gated administrative operation workflows
    status: complete
    dependencies: [TASK-0022]
    acceptance:
      - Administrative operations expose documented API-backed dry-run and approval lifecycle views/actions
      - Authenticated actor, tenant/environment scope, idempotency, policy approval, dual control, audit, and rollback evidence are enforced
      - Production mutation remains unavailable without managed credentials and explicit external approval
  - id: TASK-0024
    title: Expose approval-gated operation workflows in the admin console
    status: complete
    dependencies: [TASK-0023]
    acceptance:
      - Operators can inspect operations and initiate bounded dry-run, approve, execute, and rollback flows through API-backed UI controls
      - UI requires explicit reason, idempotency key, scope, and dual-control context and displays audit/rollback outcomes
      - UI never enables production mutation when managed credentials or external approval are unavailable
