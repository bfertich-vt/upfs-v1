      - Native pg_dump/pg_restore or an approved equivalent executes against disposable PostgreSQL targets
      - Migration, RLS, backup/restore, outbox replay, recovery, and environment-sized load evidence is retained and reproducible
      - Missing tools/targets fail closed; no production or customer data is used
