    acceptance:
      - Replace in-memory reference seams with PostgreSQL, outbox, and durable checkpoint adapters
      - Rehearse security, recovery, performance, migration, and release evidence gates
      - Verify production configuration and deployment readiness without using real customer data or credentials
  - id: TASK-0012
    title: Implement PostgreSQL persistence, migrations, and tenant-isolation adapters
    status: complete
    dependencies: [TASK-0011]
    acceptance:
      - PostgreSQL repositories and migrations replace reference Map seams behind the production composition root
      - RLS, transaction, rollback, and cross-tenant negative tests execute against a disposable PostgreSQL target when available
      - Synthetic fixtures only; missing database/configuration fails closed
  - id: TASK-0013
    title: Implement transactional outbox, durable checkpoints, and recovery workers
    status: complete
    dependencies: [TASK-0012]
    acceptance:
      - Outbox append/claim/ack/fail, retry ownership, idempotency, monotonic checkpoints, replay, and reconciliation are durable
      - Recovery and failure-injection tests prove no dual-write loss or cross-tenant leakage
  - id: TASK-0014
    title: Execute real migration, security, recovery, and load rehearsals
    status: complete
    dependencies: [TASK-0013]
    acceptance:
      - Disposable PostgreSQL migration expand/contract, restore/recovery, tenant-isolation, vulnerability, and environment-sized load/soak evidence passes
      - Results are reproducible, synthetic-only, and fail closed on missing prerequisites
  - id: TASK-0015
    title: Build immutable release, deployment, configuration, and rollback evidence
    status: complete
    dependencies: [TASK-0014]
    acceptance:
