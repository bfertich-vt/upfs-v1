acceptance_criteria:
  - Validator supports exactly one additional strict, append-only v1 correction mode for an original Specifications and contracts read record whose legacy syntax contains no path/digest pairs, and only when source handoff validation demonstrates that precise defect.
  - The mode requires original source identity/value, original candidate, bounded Reason and Correction provenance, a complete exact allowlisted table derived from Git objects, and unchanged scope statement; it fails closed for paired records, partially paired records, valid records, ambiguous legacy records, duplicates, unknown paths, wrong candidate/blob/digest, missing/blank/oversized fields, free-form, claim changes, and non-prefix changes.
  - The parser accepts the actual immutable RECOVERY-QUEUE-VALIDATION-001 legacy record only with a complete Git-object-derived correction and preserves current behavior for ordinary paired corrections and all valid handoffs.
  - Tests include an accepted fixture plus all stated negative cases; historical handoffs are not edited in this task.
  - Handoff is post-commit/provenance complete and validation has no new failure.
required_tests:
  - node --test scripts/ci-gate-validator.test.mjs
  - npm test
  - npm run traceability:check
  - git diff --check
security_requirements:
  - Maintain fail-closed immutable provenance; prohibit evidence erasure, claim mutation, tenant leakage, credential/data exposure, and correction-scope bypass.
rollback:
  - Revert only independently accepted parser change; preserve historical handoffs and negative evidence.
runtime_evidence_required: Accepted/negative mutation evidence, Git-object derivation, focused/full tests, traceability output, clean diff, candidate handoff, and independent QA/Security review.
