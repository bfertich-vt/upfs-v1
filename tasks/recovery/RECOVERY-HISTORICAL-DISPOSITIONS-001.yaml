acceptance_criteria:
  - Matrix contains exactly 110 contiguous unique rows from TASK-0001 through TASK-0110 and exactly 18 nonempty fields per row.
  - Every row records task-specific requirements, evidence classification, one four-state disposition, dependencies, security evidence, missing work, and next action.
  - ACCEPTED requires protected task-specific implementation and independent-review evidence; queue status and file existence are never treated as acceptance.
  - TASK-0112 through TASK-0123 remain excluded and frozen.
required_checks:
  - Exact row, vocabulary, count, dependency, source, task, and handoff parser
  - npm run format:check
  - npm test
  - npm run validate
  - npm run queue:check
  - npm run traceability:check
  - git diff --check and git fsck --strict --no-reflogs
  - Sensitive-data scan of the authorized diff
security:
  - Distinguish contract and synthetic test evidence from production runtime and tenant-isolation evidence.
  - Do not introduce secrets, credentials, customer data, provider data, or private financial data.
rollback: Revert only the committed matrix/task/handoff changes through reviewed corrective-forward flow; preserve prior candidates and reviews.
