security_requirements:
  - Reject unregistered adapter, service, options, and mode objects without dereferencing, enumerating, cloning, stringifying, coercing, or iterating them.
  - Keep tenant isolation deny-default and ensure synthetic BOLA evidence cannot be mistaken for production authorization evidence.
  - Emit only bounded non-sensitive rehearsal evidence; no customer, financial, credential, provider, or production data.
  - Preserve immutable historical evidence and require independent QA/Security before protected promotion.
classification_limit: Proven reference implementation only; no production persistence, workload identity, secret provider, infrastructure, deployment, release authorization, or operational claim.
rollback: Before integration abandon this isolated branch; after integration use reviewed revert or bounded corrective-forward remediation without restoring unregistered capability dereference or weakening tenant, recovery, evidence, or fail-closed controls.
