acceptance_criteria:
  - Preserve the explicit reference-only production-readiness ceiling and make no deployment or production-operation claim.
  - Durable adapter and service composition accepts only closed, explicitly registered capabilities and rejects malformed or hostile values without invoking accessors, Proxy traps, coercion, iteration, or serialization hooks.
  - PostgreSQL remains authoritative; outbox and checkpoint seams remain explicit, independently injected, and non-substitutable.
  - Production mode cannot be disabled by request-like input or an unrecognized mode, and reference rehearsal remains an explicit synthetic-only path.
  - Rehearsal evidence is closed, bounded, deterministic, synthetic-only, and fails closed on missing security, recovery, migration, configuration, or rollback evidence.
  - Negative authorization, cross-tenant, recovery, idempotency, audit/evidence, rollback, failure, and hostile-object behavior is tested where applicable.
