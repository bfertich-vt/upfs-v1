acceptance:
  - Bind the exact independently accepted TASK-0007 implementation candidate, accepted review artifact digest and source commit, and preserved R2 rejection.
  - Bind exact protected PR 33 base/head, successful pre-merge checks, inspected retained artifact, protected merge topology/tree/time, and successful post-merge checks.
