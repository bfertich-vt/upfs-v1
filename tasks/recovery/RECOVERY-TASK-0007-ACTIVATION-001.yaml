  - Disclose that the accepted capability is a synthetic-DOM/reference adapter and that browser E2E, assistive-technology certification, real API/OIDC/data-plane composition, deployment, and production operation remain unimplemented.
security:
  - Wrong or missing commits, digests, rejected review, checks, jobs, artifact, merge/tree/time, status, classification, dependency, limitation, or reviewer provenance fails closed.
  - Queue or handoff existence alone cannot establish acceptance.
  - Preserve exact accepted denial, cross-tenant, input-control, malformed-response, atomicity, cancellation, replay, rollback, leakage, and accessibility evidence.
  - No product, contract, specification, tenant, financial, credential, workflow, or deployment state changes.
