rollback: Preserve historical, rejected, accepted, and protected evidence; before integration revert only activation commits, and after integration correct forward through a separately reviewed status record.
independent_review: Fresh QA/Security distinct from implementation, remediation, activation, and prior reviewers reviews the exact activation candidate before push or promotion.
