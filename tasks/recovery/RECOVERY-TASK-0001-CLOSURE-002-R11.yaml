acceptance:
  - Every tracked and enumerated worktree path uses printable ASCII and rejects Windows reserved characters, devices, and trailing dot/space ambiguity.
  - Bounded metadata traversal includes ignored trees, never follows links/reparse entries, and fails closed on errors or limit overflow.
  - Windows native literal-path ADS enumeration rejects every named stream and fails closed on enumeration/JSON errors.
  - Non-Windows retains applicable regular-file, link-count, index/blob/worktree, and path grammar controls while ADS is explicitly inapplicable.
  - TASK-0001 remains blocked without attestation and inherited controls remain intact.
security:
  - Repository-wide printable ASCII grammar is `[0x20-0x7e]` excluding `<>:"\\|?*`, reserved devices, empty segments, and trailing dot/space.
tests:
  - node --test scripts/closure-format-check.test.mjs scripts/historical-closure-validator.test.mjs
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm test
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve history and correct forward; never accept Unicode ambiguity or named alternate streams.
independent_review: Fresh QA reviews exact R11 handoff candidate; only if accepted may it attest exact candidate before separate activation.
