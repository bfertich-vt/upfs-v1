acceptance_criteria:
  - Validator supports an explicit, append-only correction schema that supersedes only exactly identified malformed historical specification-provenance records; original text remains required and unchanged.
  - A correction identifies original record identity/value, candidate commit:path, immutable raw-Git-byte replacement digest, reason, and correction provenance; no free-form field may silently bypass validation.
  - Validator rejects missing/duplicate/ambiguous target, unauthorized field, mismatched original value, unavailable commit:path, wrong replacement digest, correction of a valid record, or correction that changes non-provenance claims.
  - Existing valid handoffs and all strict validation behavior remain unchanged without a qualifying correction.
  - Tests cover valid correction and all listed negative cases, using fixture handoffs only; no historical handoff content changes.
  - Handoff is post-commit/provenance complete and candidate validation passes.
required_tests:
  - node --test scripts/ci-gate-validator.test.mjs
  - npm test
  - npm run traceability:check
  - git diff --check
security_requirements:
  - Corrections must be immutable, exact, append-only, and fail closed; do not permit evidence erasure, credential/data exposure, or unrelated provenance bypass.
rollback:
  - Revert only independently accepted parser correction; preserve historical handoffs and rejected evidence without history rewrite.
runtime_evidence_required: Parser schema/mutation results, regression evidence, traceability output, clean diff, actual handoff, and distinct QA/Security review.
