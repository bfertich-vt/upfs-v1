acceptance_criteria:
  - Add a dependency-controlled production backlog mapped to master-plan and normative sections, with no claim that blocked/reference/synthetic work is production capability.
  - Add only the minimum real tasks necessary to deliver the first FDX-first provider-sandbox transaction vertical slice: architecture/legacy-reuse decision; provider sandbox credentials/external prerequisite; incremental sync/webhooks/pagination/reconciliation; immutable raw evidence/quarantine; canonical transaction normalization and governed taxonomy/provider category preservation; bitemporal PostgreSQL tenant-isolated persistence; transactional outbox; authorized canonical read API; runtime composition/observability; test and security acceptance; and independent QA stages.
  - Backlog also includes real prerequisites for the currently failing skill and accessibility CI gates, classified as product capability work—not synthetic evidence—and correctly ordered without displacing the FDX slice.
  - Each proposed task has structured inputs, normative sources, dependencies, role, authorized/prohibited files, acceptance criteria, contracts, required tests, tenant/security requirements, documentation, rollback, runtime evidence, and external prerequisites.
  - Queue preserves existing TASK-0001–TASK-0110 reclassifications and historic evidence; no existing task completion status is inflated. New tasks are candidate/blocked until supervisor authorization, except only a planning/decision task that is objectively ready with no unresolved dependency.
  - FDX-first and legacy UPFS/Vetralysis reuse decision is explicit: reuse requires security, licensing, compatibility, and test review; no reuse is presumed.
  - Handoff is post-commit/provenance complete and candidate validation passes; independent QA/Security review is pending.
required_tests:
  - npm run traceability:check
  - npm run validate
  - npm test
  - git diff --check
security_requirements:
  - Backlog preserves tenant isolation, authorization, evidence immutability, auditability, replay/idempotency, secret handling, leakage controls, and external-credential boundaries.
rollback:
  - Revert only independently accepted roadmap/queue additions; preserve historical reclassification and provenance evidence.
runtime_evidence_required: Requirement-to-task mapping, queue structural validation, current capability classification, exact command results, candidate handoff, and independent QA/Security review.
