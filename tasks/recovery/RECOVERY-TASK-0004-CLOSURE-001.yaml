acceptance:
  - Immutable raw evidence enters quarantine before any downstream use.
  - Verified actor identity derives organization, tenant, and environment scope; cross-scope access fails without disclosure.
  - Schema, correlation, provenance, time, media type, byte size, and content hash validation fail closed.
  - A bounded scanner rejects failures, timeouts, malware, suspicious content, and prompt injection before mutation.
  - Idempotent replay is payload-bound; changed payloads conflict without revealing another scope.
  - Conditional create and atomic record, idempotency, and audit mutation prevent partial state.
  - Audit and errors exclude raw content and scanner exception details; returned state is immutable by callers.
  - Injected failure is retryable by corrective-forward execution.
  - Capability is classified as reference-only without durable storage, managed scanning, API, or runtime claims.
security:
  - Missing, malformed, unverified, or unauthorized actors fail closed.
  - Request fields cannot override actor-derived organization, tenant, or environment scope.
  - Payload, credentials, tokens, scanner errors, and financial descriptions never enter audit or error envelopes.
  - Scanner timeout and suspicious classifications leave no record, idempotency entry, or success audit.
tests:
  - node --test services/evidence-intake.test.mjs
  - Authorization, forged scope, cross-tenant, and cross-environment denial
  - Schema, correlation, provenance, timestamp, hash, media, byte-size, and control-character rejection
  - Replay, changed-payload conflict, conditional create, and concurrent create
  - Scanner exception, timeout, malware, suspicious, prompt-injection, and malformed-result rejection
  - Audit/error leakage, immutable returned copies, injected failure, atomic rollback, and corrective-forward retry
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run queue:check
  - npm run traceability:check
  - npm test
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve history; use a reviewed revert before integration or a corrective-forward retry after correcting the failed dependency.
independent_review: A fresh QA/Security agent must review the exact committed candidate from an isolated worktree without editing implementation.
