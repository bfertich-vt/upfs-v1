acceptance_criteria:
  - Every accepted provenance erratum contains exactly one allowlisted Reason field and exactly one allowlisted Correction provenance field, each non-empty, non-whitespace, and 3-280 characters; neither may be omitted, blank, free-form extension text, duplicated, oversized, or used to bypass the strict allowlist.
  - Parser rejects a formally otherwise-valid correction when either required field is absent, whitespace-only, oversized, duplicated, or uses unauthorized fields; each rejection is covered by a negative fixture.
  - Valid correction fixtures contain both fields and preserve exact append-only, raw-Git-byte, target-identity, and non-claim-changing semantics established by the original task.
  - Existing qualifying corrections and ordinary valid handoffs retain behavior; historical handoffs remain unedited.
  - The QA rejection at docs/handoffs/RECOVERY-HISTORICAL-TRACEABILITY-ERRATA-PARSER-001-QA.md is addressed directly, without weakening security/provenance validation.
  - Handoff is post-commit and provenance complete; candidate validation passes except documented inherited historical correction/matrix failures.
required_tests:
  - node --test scripts/ci-gate-validator.test.mjs
  - npm test
  - npm run traceability:check
  - git diff --check
security_requirements:
  - Fail closed on malformed correction fields; preserve immutable append-only provenance and prohibit erasure, ambiguity, claim changing, credential/data exposure, tenant leakage, and unrelated bypass.
rollback:
  - Revert only an independently accepted corrective parser commit; preserve historical handoffs, the rejected QA evidence, and all history.
runtime_evidence_required: Exact negative mutation results for every bounded-field failure, focused and full tests, traceability output, clean diff, candidate handoff, and distinct QA/Security review.
