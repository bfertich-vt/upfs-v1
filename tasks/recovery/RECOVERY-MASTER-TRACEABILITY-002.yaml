acceptance_criteria:
  - Matrix has exactly the current validator's 13 required columns and at least 10 substantive rows; every row has a stable unique identifier and all evidence cells are either existing repository paths or precise supported absent-evidence form.
  - Matrix includes every required source-section binding: MASTER_PLAN Outcome/Delivery-stages/V1-acceptance-themes; vision Initial-commercial-slice/Platform-planes/Explicit-non-goals-for-v1; architecture Data-path/Core-services/Multi-tenancy-and-scale/Reliability.
  - Matrix includes exactly one binding for each TASK-0001–TASK-0110 using accepted queue reclassification classification and concrete task-specific evidence/provenance or supported absent evidence; no synthetic/reference/contract claim is upgraded to production.
  - Matrix includes FDX-01 with explicit fdx-first, legacy, security, license, compatibility, and test review treatment, and truthfully identifies its unresolved decision/work.
  - Matrix covers every product and control-plane requirement/gap in task input sources with source section, contracts, tests, runtime/security evidence, docs/provenance, classification, missing work, external dependency, and next authorized task.
  - No fabricated paths, tests, provenance, runtime proof, or product/release claim; report known missing work/external dependencies precisely.
  - Handoff is post-commit/candidate-bound and traceability reports no matrix-specific error.
required_tests:
  - npm run traceability:check
  - npm test
  - git diff --check
security_requirements:
  - Preserve tenant/security evidence limits and fail closed on unsupported capability claims; no sensitive data in matrix.
rollback:
  - Revert only accepted matrix change; preserve evidence history.
runtime_evidence_required: Validator-conformant source/row counts, traceability output, classification/task-binding audit, clean diff, actual handoff, and independent QA/Security review.
