id: RECOVERY-CI-PG-YAML-TAG-020
title: Reject tagged or metadata-ambiguous PostgreSQL CI port mappings
state: in_progress
role: Backend
role_file: agents/BACKEND.md
scope: >-
  Correct forward from the rejected RECOVERY-CI-PG-PORT-PARSER-019 candidate.
  Preserve the digest-pinned disposable PostgreSQL Actions service and its
  fixed loopback migration boundary, while validating the YAML AST so only one
  ordinary untagged plain scalar mapping precisely equal to 5432:5432 passes.
allowed_files:
  - .github/workflows/validate.yml
  - package.json
  - package-lock.json
  - scripts/postgres-service-ci-gate.mjs
  - scripts/postgres-service-ci-gate.test.mjs
  - tasks/recovery/RECOVERY-CI-PG-YAML-TAG-020.yaml
  - docs/handoffs/RECOVERY-CI-PG-YAML-TAG-020.md
prohibited_files:
  - README.md
  - START_HERE.md
  - tasks/queue.yaml
  - services
  - apps
  - infra/migrations
  - specs
  - docs/reviews
acceptance_criteria:
  - The digest-pinned GitHub Actions PostgreSQL service publishes exactly one ordinary untagged plain scalar 5432:5432 mapping.
  - Explicit YAML tags including !!str, local, custom, and unknown tags, quoted scalars, anchors, aliases, collections, and all prior malformed mappings fail structurally.
  - The migration step uses only the exact fixed 127.0.0.1:5432 disposable test URL; dynamic service ports are not accepted.
  - Current TASK-020 identity, strict raw/encoded URL rejection, constructed-client-only boundary, migrations, unscoped denial, and cross-tenant RLS proof remain intact.
  - No production URL, credential, customer data, financial data, provider credential, or deployment configuration is introduced.
required_sources:
  - AGENTS.md
  - agents/BACKEND.md
  - agents/WORKTREES.md
  - agents/HANDOFF_TEMPLATE.md
  - specs/00_constitution/engineering_constitution.md
  - specs/09_cicd/delivery_pipeline.md
  - specs/10_security/security_baseline.md
  - specs/12_testing/test_strategy.md
  - docs/reviews/RECOVERY-CI-PG-PORT-PARSER-019-QA.md
  - qa/recovery-ci-pg-port-parser-019 commit 3322bc6977ad4b31d81f77343114e91579e0b370
required_tests:
  - npm ci --ignore-scripts
  - node --test scripts/postgres-service-ci-gate.test.mjs
  - npm run migration:check without UPFS_TEST_DATABASE_URL fails closed
  - npm test
  - npm run format:check
  - npm run lint
  - npm run static:check
  - npm run ci:gates
  - npm run validate
  - Node YAML parse of this structured input
  - git diff --check
  - Hosted Ubuntu proof after independent QA and integration
security_and_tenant_isolation: >-
  The service is digest-pinned, disposable, and reachable only through the
  fixed loopback test boundary. The parser retains YAML lexical metadata so a
  tag cannot masquerade as the permitted literal. Raw and encoded URL override
  syntax remains rejected before client construction. The gate keeps synthetic
  rows, NOSUPERUSER unscoped denial, and transaction-local tenant RLS assertions.
rollback: >-
  Correct forward only. Preserve the rejected candidate, reviews, commits, and
  workflow evidence. If QA or hosted CI finds a defect, make a fresh isolated
  corrective branch and independent review; do not amend, reset, force-push,
  delete branches, or rewrite history.
handoff_requirements:
  - Task ID, role, role-file path and digest, agent thread, worktree, branch, commit, and owned files
  - Sources, acceptance evidence, commands/results, negative cases, security and tenant-isolation analysis
  - Predecessor rejection, AST port regression, rollback, limitations, hosted proof, and pending independent QA
