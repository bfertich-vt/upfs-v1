acceptance_criteria:
  - The matrix traces every substantive requirement in all six sections of specs/00_constitution/engineering_constitution.md, with one or more truthful requirement rows per section and all 13 mandatory evidence columns.
  - Added rows use current repository evidence or the validator-supported precise absent-evidence form; they do not invent production capability, runtime evidence, tests, ownership, or acceptance.
  - Existing master-plan, vision, architecture, FDX-first/legacy decision, and TASK-0001–TASK-0110 coverage remains intact and valid.
  - Each added row states security/tenant-isolation evidence, classification, missing work, external dependency, and next authorized task truthfully.
  - The RECOVERY-MASTER-TRACEABILITY-002-QA rejection is directly addressed, and no unrelated files or historical evidence are changed.
  - Post-commit handoff is provenance complete and candidate validation has no matrix-origin failure.
required_tests:
  - npm run traceability:check
  - npm test
  - git diff --check
security_requirements:
  - Preserve fail-closed evidence semantics; do not mask security, tenant-isolation, leakage, governance, or provenance gaps as implemented.
rollback:
  - Revert only an independently accepted matrix correction; preserve rejection evidence and history.
runtime_evidence_required: Matrix section-to-row mapping, validator output, complete tests, clean diff, candidate handoff, and independent QA/Security review.
