acceptance_criteria:
  - The implementation is a clean diff from authoritative integration commit 4c13247833b5f331ac73e1f76b9c96fbda1da1bf and ports no rejected historical commits.
  - Every external_historical_evidence record is fail-closed by exact schema, lowercase 40-hex commit, lowercase 64-hex digest, exact availability label, source resolution, and raw Git blob-content digest equality.
  - Path validation is platform-independent and rejects POSIX absolute paths, Windows drive/colon paths, UNC paths, single-backslash rooted paths, mixed-separator traversal, dot segments, empty paths, and non-repository-contained paths before Git resolution.
  - Fixed Git argument arrays are used; no shell command can execute task-provided values.
  - Valid evidence passes and all invalid schema/source/digest/path/availability/injection cases fail deterministically on Windows and POSIX semantics.
  - No queue, historic artifacts, product behavior, traceability matrix, workflow, release, or readiness claim changes.
required_tests:
  - node --test scripts/ci-gate-validator.test.mjs
  - npm test
  - npm run traceability:check
  - git diff --check
security_requirements:
  - Validate both slash styles independent of the host OS and reject before invoking Git.
  - Never evaluate task-provided content in a shell; preserve evidence as immutable raw Git blob content only.
  - Do not introduce credentials, tenant/customer data, or weaken tenant isolation.
rollback:
  - Revert only an independently accepted clean-port commit; retain all prior candidates and QA artifacts. Do not rewrite history.
runtime_evidence_required: Clean base diff; Windows- and POSIX-style negative path evidence; focused/full tests; literal hash command; expected recovery baseline checks; and a distinct committed QA/Security report.
