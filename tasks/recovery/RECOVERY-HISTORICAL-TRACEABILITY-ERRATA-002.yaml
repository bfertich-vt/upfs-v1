prohibited_files:
  - docs/reviews/**
  - docs/MASTER_PLAN_TRACEABILITY.md
  - tasks/queue.yaml
  - scripts/**
  - package.json
  - .github/**
  - README.md
  - START_HERE.md
  - apps/**
  - services/**
  - packages/**
  - contracts/**
  - specs/**
acceptance_criteria:
  - Each named historical handoff receives exactly one appended Git-bound provenance erratum v1 matching the parser allowlist byte-for-byte in shape and preserving the original Git-resolvable handoff as a literal prefix.
  - Each erratum declares original handoff path/source commit/candidate/record, a bounded nonempty Reason, bounded nonempty Correction provenance, and a complete correction table covering every malformed original Specifications and contracts read path exactly once.
  - Every correction row binds the original candidate, actual immutable Git blob, and SHA-256 over the raw Git blob bytes; no status, acceptance claim, test result, review state, risk, limitation, production classification, or QA result changes.
  - `npm run traceability:check` and `npm run validate` pass with no provenance exceptions; all corrections are independently reproducible from Git objects.
  - No parser, queue, product, workflow, matrix, README, START_HERE, specification, or unrelated historical handoff change occurs.
  - Post-commit handoff is provenance complete and explicitly distinguishes correction of historical record syntax/digests from proof of product capability.
required_tests:
  - npm run traceability:check
  - npm run validate
  - npm test
  - git diff --check
security_requirements:
  - Append-only raw-Git-byte provenance repair must fail closed; prohibit ambiguity, evidence erasure, claim changes, credential/data exposure, tenant leakage, and correction of otherwise-valid records.
rollback:
  - Revert only an independently accepted appended erratum/correction commit; never rewrite historical commits or discard rejection evidence.
runtime_evidence_required: Git-object commands/results per table row, validator output, full validation/test output, clean diff, candidate handoff, and independent QA/Security review.
