acceptance_criteria:
  - A complete read-only disclosure audit is recorded before any repository-visibility action.
  - The audit distinguishes detected secrets/customer data from the author-email and license/legal disclosure decisions.
  - The audit preserves the no-merge posture for PR #1 and records that final user confirmation is still required before any public transition.
  - Future-facing governance text accurately permits a distinct, role-bound Codex QA/Security evidence review without calling it human review or asserting GitHub approval equivalence.
  - A future fresh independent QA/Security review is required from the committed candidate state in an isolated worktree.
required_tests:
  - Structural YAML parse.
  - npm run queue:check.
  - npm run traceability:check.
  - npm run validate.
  - git diff --check.
security_requirements:
  - Documentation-only work; no secret, credential, customer, tenant, provider, runtime, or GitHub-setting action.
  - Retain only redacted aggregate audit evidence; do not record credential-shaped values or financial records.
  - Do not change visibility, publish branches, create pull requests, alter protection/rulesets, or create/read secrets.
rollback: >-
  Correct forward or revert through a separately reviewed commit only. Preserve audit evidence
  and history; do not rewrite history, delete branches, or discard evidence.
runtime_evidence_required: >-
  Read-only audit scope/results, the exact repository/ref observations, and a fresh independent
  QA/Security review binding the committed candidate state.
