acceptance:
  - Deterministically transport the 30 accepted historical-topology handoff candidates, the two later accepted current handoff candidates required by strict shallow-clone provenance validation, and both exact erratum-source commits (34 objects total).
  - Verify exact SHA-256 identities for the bundle, manifest-declared commit objects, and every derivation source.
  - Prove a fresh shallow/clean clone fails before hydration and validates after hydration without validator semantic changes.
  - Fail closed for bundle-byte tampering, manifest or ref substitution, omitted required objects, duplicates or mismatches, and use of an historical path for a current handoff.
  - Preserve strict validation of all current and resolvable handoffs.
required_tests:
  - git bundle verification and SHA-256 verification
  - fresh clone hydration regression
  - corruption, substitution, omission, duplicate, mismatch, and current-handoff negative tests
  - provenance, queue, validation, traceability, security/accessibility/PostgreSQL relevant gates, full test suite
tenant_security: No tenant/runtime behavior changes. No secrets, credentials, customer, provider, or financial data may be added. Historical provenance must remain fail-closed.
rollback: Preserve v1/v2 and all rejected evidence. Correct forward in a new isolated branch; never weaken the validator, rewrite history, or delete evidence.
runtime_evidence: Repository-local immutable Git-object transport and clean-clone gate evidence only; not production runtime evidence.
