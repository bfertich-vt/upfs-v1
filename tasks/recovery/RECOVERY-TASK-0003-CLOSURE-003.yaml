acceptance:
  - Runtime canonical-string validation exactly enforces every existing transaction-schema maximum length.
  - Provider and provenance-kind values of length 100 are accepted and length 101 are rejected without contract drift.
  - All bounded canonical metadata fields have zero, one, exact-boundary, over-boundary, whitespace, control, and mixed-string coverage.
  - Connector category validation fails closed before evidence, canonical, nonce, idempotency, or audit mutation.
  - Corrected connector retries succeed and valid category values are preserved exactly.
  - R1 and R2 rejection evidence remains unchanged and capability remains a reference implementation only.
security:
  - Rejected metadata is never echoed in response or audit evidence.
  - Connector prevalidation occurs before mutable evidence or canonical boundaries.
  - Tenant and environment scope remains derived from verified membership and cross-scope responses remain non-disclosing.
tests:
  - node --test services/transaction-registry.test.mjs services/connector-ingestion.test.mjs
  - Boundary coverage at 0, 1, exact schema maximum, and maximum plus 1
  - Whitespace-only, boundary whitespace, control-character, and mixed-string rejection
  - Mutation-free connector rejection and successful corrected retry
  - npm test
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run queue:check
  - npm run traceability:check
  - npm run lint
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve both rejection records; use a reviewed revert before integration or a separate corrective-forward commit after integration.
independent_review: A fresh QA/Security agent must review the exact committed candidate from an isolated worktree without editing implementation.
