acceptance:
  - Canonical UTC timestamps reject impossible calendar dates and noncanonical representations without Date normalization.
  - Valid leap-year, calendar, time, and one-to-nine-digit fractional-second boundaries remain accepted.
  - Derived scope accepts only exact own primitive-string UUID fields and bounds every malformed adapter value to a non-disclosing denial.
  - Timestamp and scope rejection occurs before scanner, record, idempotency, and audit mutation.
  - Corrected retry succeeds without state retained from the rejection.
  - Existing connector and deterministic registry behavior remains unchanged and green.
  - Capability remains classified as a reference implementation only.
security:
  - Never coerce or interpolate attacker-controlled scope values.
  - Getter, proxy, Symbol, BigInt, object, array, missing, and extra scope values fail closed without raw error or value leakage.
  - Scope denials use identical bounded envelopes and leave no record, idempotency entry, audit, or scanner call.
