acceptance:
  - Namespace idempotency by verified organization, tenant, environment, operation, and caller key without a cross-tenant collision oracle.
  - Commit domain state, idempotency state, and the success audit event atomically; injected commit or audit failure leaves no partial state.
  - Validate the injected repository contract at composition and return bounded fail-closed errors rather than raw adapter exceptions.
  - Enforce opaque UUID identifiers, nonempty immutable actor identity, and resource shapes conforming to the supplied identity foundation schema.
  - Use the normative lifecycle value deactivated and deny child environment reads or mutations when a parent tenant or organization is not active.
  - Append a redacted audit event for every replay attempt while producing only one domain mutation.
  - Preserve the R1 rejection and distinguish rejected R1 commits from the new R2 implementation and exact externally reviewed final candidate.
security:
  - Same idempotency key may be used independently by different verified scopes with no collision or existence disclosure.
  - Cross-tenant, forged-scope, parent-inactive, malformed-identity, adapter-failure, audit-failure, replay, and stale-version paths fail closed.
  - Audit and errors exclude payload values, names, credentials, tokens, financial data, and adapter exception text.
tests:
  - node --test services/identity-organization-tenant-and-environment-foundation.test.mjs
  - Same-key cross-tenant success and changed-payload replay rejection within one verified scope
  - Atomic domain/idempotency/audit failure with retry and corrective-forward recovery
  - Incomplete or throwing adapter rejection with bounded errors
  - UUID, actor identity, schema resource shape, and deactivated lifecycle validation
  - Parent organization/tenant lifecycle denial for child reads and mutations
  - Redacted append-only replay-attempt audit evidence
  - Authorization, forged-scope, cross-tenant, concurrency, lifecycle, rollback, and leakage negatives
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run queue:check
  - npm run traceability:check
  - npm test
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve R1 and its rejection; correct forward or perform a reviewed revert of only R2 commits without deleting audit evidence.
independent_review: A fresh QA/Security agent, distinct from the R1 reviewer and author, must review the exact committed R2 candidate from an isolated worktree.
