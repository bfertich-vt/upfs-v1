acceptance_criteria:
  - README and START_HERE state the truthful recovery status: queue, provenance, traceability, repository validation, and local full suite are passing on the authoritative integration checkout, but product capability is not accepted/production-ready and product work remains gated.
  - Documents do not direct readers to start TASK-0001 or any ready product task when the audited queue is reclassified/frozen; they identify the verified commands and the current branch without overstating GitHub deployment governance.
  - Repository governance documentation records verified external facts: GitHub default branch is codex/task-0001-baseline; remote CODEOWNERS error API still reports unknown @upfs teams until the corrective branch is published; PR #1 is open against main with no reviews; branch protection/rulesets API returns a private-plan 403 blocker.
  - Documentation distinguishes local control-plane gates passing from external GitHub protection/reviewer enforcement blocked; does not claim production readiness, CODEOWNERS enforcement, protected main, or release certification.
  - Existing architecture/security/tenant/provenance guidance remains truthful and no product implementation/queue/CODEOWNERS/workflow changes occur.
  - Post-commit handoff provides immutable command/result provenance and rollback notes; independent QA/Security review remains required.
required_tests:
  - npm run traceability:check
  - npm run validate
  - npm test
  - git diff --check
security_requirements:
  - Do not expose tokens, credentials, sensitive artifacts, unredacted external API data, or tenant information; preserve fail-closed external-governance status.
rollback:
  - Revert only independently accepted documentation correction; preserve external audit evidence and historical recovery records.
runtime_evidence_required: Command outputs from current authoritative candidate, exact GitHub audit endpoints/results, documentation diff, candidate handoff, and independent QA/Security review.
