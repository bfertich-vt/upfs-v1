acceptance_criteria:
  - Actor, tenant, and environment scope is derived from verified identity and never accepted from request context.
  - Retrieval is bounded, read-only, and limited to approved canonical or projection records.
  - Retrieved text is untrusted data and cannot modify system rules or enable tools, writes, or actions.
  - Request, context, retrieval, model output, citation, and response shapes are closed and bounded before dependent calls or release.
  - Every factual financial claim is bound to exact authorized record evidence; absent, foreign, duplicate, or mismatched citations deterministically refuse.
  - Retrieval, model, policy, audit, timeout, malformed-data, injection, cancellation, supersession, and rate-limit failures fail closed.
  - Audit is metadata-only, correlation-bound, and contains no prompt, record, answer, evidence payload, or financial value.
  - Deterministic replay of an identical scoped request cannot produce a conflicting accepted answer.
required_tests:
  - node --test --test-concurrency=1 services/governed-chat.test.mjs
  - npm test -- --test-concurrency=1
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run lint
  - npm run queue:check
  - npm run traceability:check
  - npm audit --audit-level=high
  - git fsck --full --strict
security_requirements:
  - Scope is server-derived, deny-by-default, and cross-tenant records reject the complete retrieval result without disclosure.
  - Prompt injection remains labelled untrusted content with no tool or action capability.
  - Citation verification is deterministic and independent of the model.
  - Audit and errors contain stable metadata only; no customer, prompt, record, answer, or financial payload leaks.
classification_limit: Proven reference implementation; synthetic injected retrieval/model/policy/audit only, with no real model, RAG, registry, Redis, production identity, API host, deployment, or production-operation claim.
rollback: Preserve historical and rejected evidence; use a reviewed revert before integration or separate corrective-forward change afterward; never weaken scope derivation, closed schemas, citation verification, no-tool/no-write, audit, or validation controls.
handoff: docs/handoffs/RECOVERY-TASK-0008-CLOSURE-001.md
