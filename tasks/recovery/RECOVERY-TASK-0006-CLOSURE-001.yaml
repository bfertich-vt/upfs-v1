acceptance_criteria:
  - Deterministic projection and search are tenant-scoped and preserve canonical/provider truth as immutable input.
  - Authentication denial and cross-tenant attempts disclose no documents and mutate no projection state.
  - Event replay, out-of-order delivery, same-version mutation, and stale cursors fail closed or are safely idempotent.
  - Reconciliation surfaces drift without changing canonical truth.
  - Rebuild stages a replacement projection and promotes its alias atomically; indexing or alias failure leaves the prior projection available and creates an audit record.
  - Cursors are signed, query- and tenant-bound, bounded, and invalidated after projection mutation.
  - Search results redact internal hashes and projection timing metadata.
  - Contract, generated artifact, and documentation drift remain fail-closed.
required_tests:
  - node --test --test-concurrency=1 services/transaction-projection.test.mjs
  - node --test --test-concurrency=1 services/transaction-projection.test.mjs services/transaction-registry.test.mjs services/transaction-outbox.test.mjs
  - npm test
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run queue:check
  - npm run traceability:check
  - npm run lint
  - npm audit --audit-level=high
  - git fsck --full --strict
security_requirements:
  - Derive tenant scope only from verified actor authorization and the requested tenant boundary.
  - Reject mixed-tenant canonical inputs instead of filtering or disclosing them.
  - Bind cursor integrity to tenant, query, projection generation, and offset.
  - Keep canonical PostgreSQL truth conceptually authoritative; projection reconciliation and rebuild cannot mutate it.
  - Audit injected indexing and alias-promotion failures without recording financial payload content.
classification_limit: Proven reference implementation; no real OpenSearch, Redis, PostgreSQL, deployed API, managed infrastructure, or production-operation claim.
rollback: Preserve historical and rejected evidence; use a reviewed revert before release or a separate corrective-forward commit after integration; never weaken validation.
handoff: docs/handoffs/RECOVERY-TASK-0006-CLOSURE-001.md
