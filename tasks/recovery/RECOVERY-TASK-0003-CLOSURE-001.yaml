acceptance:
  - Registry entries deterministically bind schema id, version, repository-relative source path, and raw-byte SHA-256.
  - Registry publication is atomic and an injected pre-publication failure preserves the prior artifact.
  - Canonical transactions preserve deterministic money, provider categories, governed taxonomy, bitemporal metadata, source observations, evidence references, confidence, provenance, classification, lifecycle, actors, and version.
  - Verified actor membership derives tenant and environment scope; request scope cannot override it.
  - Cross-tenant and cross-environment access is denied without resource-existence disclosure.
  - Writes are idempotent, optimistic-concurrency protected, audited, and correctable forward without destructive history edits.
  - Contract, generated artifact, and source drift fail closed.
  - Capability is classified as a reference implementation without PostgreSQL, provider, route, deployment, or production-runtime claims.
security:
  - Missing, malformed, unverified, or unauthorized actors fail closed.
  - Tenant and environment scope derives only from verified membership.
  - Unknown and malformed money, taxonomy, category, time, evidence, and provenance values fail closed.
  - Audit records exclude descriptions, money, provider data, credentials, tokens, and mutation payloads.
tests:
  - node --test services/transaction-registry.test.mjs
  - Authorization, forged-scope, cross-tenant, and cross-environment denials
  - Idempotent replay, changed-payload replay, optimistic concurrency, and concurrent stale-write rejection
  - Audit redaction, malformed canonical metadata, leakage, injected failure, and corrective-forward recovery
  - Deterministic regeneration, source hash binding, generated drift, and atomic failure preservation
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run queue:check
  - npm run traceability:check
  - npm test
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve history; use a reviewed revert before integration or a corrective-forward transaction version after integration.
independent_review: A fresh QA/Security agent must review the exact committed candidate from an isolated worktree without editing implementation.
