acceptance:
  - reviewed_candidate equals remediation candidate, is the sole parent of a distinct review commit, and the accepted review artifact is introduced only by that review commit.
  - Exactly one unnegated ACCEPTED verdict binds the exact candidate; rejected, ambiguous, stale, pre-seeded, and non-direct review substitutions fail closed.
  - Every queue criterion maps exactly once to one unique criterion-specific excerpt in the exact accepted QA artifact and commit; unrelated, generic, duplicate, and outside-chain evidence fails closed.
  - PR, run, job, and artifact IDs are positive safe integers; run/job IDs are unique; merge time is canonical RFC3339 UTC; the merge subject contains an exact PR token.
  - Formatting covers all closure-control files while the matrix and compact legacy queue validator use documented stable structural checks without broad churn.
  - TASK-0002 through TASK-0110 remain blocked and TASK-0112 through TASK-0123 remain untouched.
security:
  - Repository evidence validation only; no runtime tenant, authorization, financial, API, contract, migration, or durable-state behavior changes.
  - Git object topology, filesystem containment, symlink escape, exact keys, cross-task mismatch, dependency completeness, and evidence substitution fail closed.
  - No credentials, secrets, customer data, or production financial data are introduced.
tests:
  - node --test scripts/queue-validator.test.mjs scripts/historical-closure-validator.test.mjs scripts/closure-format-check.test.mjs
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run validate
  - npm run queue:check
  - npm run traceability:check
  - npm test
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve all rejected history and correct forward; revert only after independent review and never weaken an evidence gate.
independent_review: Fresh QA/Security review is required from an isolated worktree at the exact committed r2 candidate; author cannot self-accept.
