acceptance:
  - One shared canonical metadata validator rejects C0 and C1 controls in actor, observations, evidence, provider/category, taxonomy, and provenance fields.
  - Representative C1 boundaries U+0080, U+0085, and U+009F plus mixed C0/C1 values fail closed before scope or state mutation.
  - Valid Unicode outside the C0/C1 ranges remains accepted within contract length bounds.
  - Connector provider is nonempty, canonical, control-free, and at most 100 characters before evidence, nonce, idempotency, audit, or canonical mutation.
  - Provider values of lengths 1 and 100 pass; values of length 101 fail; corrected same-key retry remains possible.
  - Rejection history remains unchanged and the capability remains reference-only.
security:
  - Invalid metadata is never echoed in response or audit evidence.
  - Tenant and environment scope remains derived from verified membership.
  - Invalid actor and provider inputs cannot consume replay or idempotency state or create evidence/audit state.
tests:
