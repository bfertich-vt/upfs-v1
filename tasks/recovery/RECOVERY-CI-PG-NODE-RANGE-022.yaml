id: RECOVERY-CI-PG-NODE-RANGE-022
title: Bind PostgreSQL CI raw port spelling to its parsed AST node range
state: in_progress
role: Backend
role_file: agents/BACKEND.md
scope: >-
  Correct forward from the independently rejected RECOVERY-CI-PG-RAW-PORT-021
  candidate. Preserve the digest-pinned disposable PostgreSQL Actions service,
  fixed loopback migration boundary, strict URL validation, and tenant RLS
  rehearsal while ensuring lexical port validation is derived only from the
  parsed services.postgres.ports AST node range.
allowed_files:
  - .github/workflows/validate.yml
  - package.json
  - package-lock.json
  - scripts/postgres-service-ci-gate.mjs
  - scripts/postgres-service-ci-gate.test.mjs
  - tasks/recovery/RECOVERY-CI-PG-NODE-RANGE-022.yaml
  - docs/handoffs/RECOVERY-CI-PG-NODE-RANGE-022.md
prohibited_files:
  - README.md
  - START_HERE.md
  - tasks/queue.yaml
  - services
  - apps
  - infra/migrations
  - specs
  - docs/reviews
acceptance_criteria:
  - Raw validation is derived only from the bounded parsed services.postgres.ports AST node range, never a global workflow regex.
  - A canonical decoy service cannot satisfy validation while the real PostgreSQL service has alternate valid indentation or raw spelling.
  - The actual PostgreSQL port has exactly one ordinary untagged plain scalar 5432:5432 mapping and its complete source line is exactly ten spaces, dash, one space, mapping, and LF.
  - Tagged, quoted, anchored, aliased, collection, malformed, extra, CRLF, whitespace, comment, and prior malformed port forms reject.
  - Digest-pinned service, deterministic current task identity, fixed loopback URL/client construction, migration execution, unscoped denial, and tenant RLS assertions remain intact.
  - No production URL, credential, customer data, financial data, provider credential, or deployment configuration is introduced.
required_sources:
  - AGENTS.md
  - agents/BACKEND.md
  - agents/WORKTREES.md
  - agents/HANDOFF_TEMPLATE.md
  - specs/00_constitution/engineering_constitution.md
  - specs/03_architecture/system_architecture.md
  - specs/09_cicd/delivery_pipeline.md
  - specs/10_security/security_baseline.md
  - specs/12_testing/test_strategy.md
  - docs/reviews/RECOVERY-CI-PG-RAW-PORT-021-QA.md at d2914018abe614d585f95e38757eaf719b035aef
required_tests:
  - npm ci --ignore-scripts
  - node --test scripts/postgres-service-ci-gate.test.mjs
  - npm run migration:check without UPFS_TEST_DATABASE_URL fails closed
  - npm test
  - npm run format:check
  - npm run lint
  - npm run static:check
  - npm run ci:gates
  - npm run validate
  - Node YAML parse of this structured input
  - git diff --check
  - Hosted Ubuntu proof after independent QA and integration
security_and_tenant_isolation: >-
  The service remains digest-pinned, disposable, and reachable only through a
  fixed loopback test boundary. The source check is AST-path scoped, preventing
  an unrelated service from masking the actual PostgreSQL mapping. URL override
  syntax is rejected before client construction. The gate uses synthetic rows,
  requires NOSUPERUSER unscoped denial, and requires transaction-local tenant
  scope to observe only tenant-A data.
rollback: >-
  Correct forward only. Preserve rejected candidates, reviews, commits, and
  workflow evidence. If QA or hosted CI finds a defect, use a fresh isolated
  corrective branch and independent review; do not amend, reset, force-push,
  delete branches, or rewrite history.
handoff_requirements:
  - Task ID, role, role-file path and digest, agent thread, worktree, branch, commit, and owned files
  - Sources, acceptance evidence, commands/results, negative cases, security and tenant-isolation analysis
  - Predecessor rejection, node-range decoy regression, rollback, limitations, hosted proof, and pending independent QA
