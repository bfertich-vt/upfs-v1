acceptance:
  - Establish a production-capable domain/service boundary for verified identities, organizations, tenants, and environments without claiming durable persistence or deployment.
  - Derive tenant and environment scope from a verified actor and deny access by default.
  - Enforce organization, tenant, and environment lifecycle constraints with deterministic tenant-scoped evidence.
  - Return non-disclosing denials for cross-tenant access and prevent unauthorized reads and writes.
  - Require idempotency for mutations, reject changed-payload replay, and enforce optimistic concurrency for state-sensitive writes.
  - Append redacted immutable audit events for attempted and completed mutations.
  - Injected failure leaves an auditable outcome and supports documented corrective-forward recovery without partial state.
  - Truthfully identify the supplied in-memory repository as a reference composition seam requiring a durable production adapter.
security:
  - Missing, malformed, unverified, or unauthorized actors fail closed.
  - Actor-derived organization, tenant, and environment bindings cannot be overridden by request data.
  - Cross-tenant and cross-environment access reveals no resource existence or sensitive values.
  - Audit records exclude credentials, tokens, financial data, and unredacted mutation payloads.
tests:
  - node --test services/identity-organization-tenant-and-environment-foundation.test.mjs
  - Missing or invalid actor and unauthorized action denials
  - Forged tenant/environment scope and cross-tenant read/write non-disclosure
  - Duplicate idempotency replay and changed-payload replay rejection
  - Stale version and invalid lifecycle transition rejection
  - Audit redaction and append-only behavior
  - Injected failure atomicity, audit evidence, rollback, and corrective-forward recovery
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run queue:validate
  - npm run traceability:validate
  - npm test
  - npm audit --audit-level=high
  - git fsck --full --strict
  - git diff --check
rollback: Preserve history; use a reviewed revert of the task commits or corrective-forward lifecycle recovery through the service boundary.
independent_review: A fresh QA/Security agent must review the exact committed handoff candidate from an isolated worktree without editing implementation.
