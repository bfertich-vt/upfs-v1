acceptance_criteria:
  - Under recovery_freeze, immutable historical reclassification validation applies exactly to TASK-0001 through TASK-0110, as defined by the reclassification report and traceability requirement—not all future TASK-#### IDs.
  - All 110 historical tasks still require blocked status, exact report binding, immutable artifacts/excerpts, and production-proof requirements where classified; any omission, altered ID, duplicate, or changed classification fails closed.
  - New production TASK IDs above TASK-0110 may exist without historical report records, but must not carry historical-only report_row/classification/historical_evidence/production_proof fields; an attempt to use those fields or change a historical task fails validation.
  - Tests cover valid TASK-0111 append, 110-record preservation, new historical-field rejection, out-of-range/report mismatch, and dependency/ready-state behavior.
  - No queue or roadmap task is changed in this implementation; post-commit handoff is provenance complete and full validation has no new error.
required_tests:
  - node --test scripts/queue-validator.test.mjs
  - npm run queue:check
  - npm run traceability:check
  - npm run validate
  - npm test
  - git diff --check
security_requirements:
  - Preserve fail-closed historical evidence, authorization/tenant isolation, auditability, and no claim escalation through new task IDs.
rollback:
  - Revert only independently accepted validator boundary correction; preserve all historic evidence and uncommitted roadmap draft.
runtime_evidence_required: Mutation tests, queue/traceability/validation/full-test output, candidate handoff, and independent QA/Security review.
