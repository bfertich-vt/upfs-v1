acceptance_criteria:
  - A missing, malformed, hostile, control-bearing, or oversized policyVersion fails construction before any sensitive or external dependency can run.
  - The bounded safe configured policyVersion is held as immutable private instance state.
  - Every metadata-only audit attempt and outcome contains the exact configured policy_version.
  - Audits after a valid independent policy decision also bind its exact policy_id and policy_decision_version.
  - Request, retrieval, model, policy dependency, and public-instance values cannot override configured policy provenance.
  - Denial, validation failure, policy exception, retrieval/model timeout or outage, cancellation, supersession, replay, rate limit, refusal, success, and audit failure paths remain fail closed without sensitive leakage.
  - All R1 authorization, tenant-isolation, citation, closed-shape, replay, rollback, and classification controls remain intact.
required_tests:
  - node --test --test-concurrency=1 services/governed-chat.test.mjs
  - node --test --test-concurrency=1 services/governed-chat.test.mjs services/policy-workflow.test.mjs scripts/task-0099-ai-context-safety.test.mjs
  - npm test -- --test-concurrency=1
  - npm run contracts:check
  - npm run generated:check
  - npm run static:check
  - npm run policy:check
  - npm run prompt:check
  - npm run format:check
  - npm run lint
  - npm run queue:check
  - npm run traceability:check
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm audit --audit-level=high
  - git fsck --full --strict
security_requirements:
  - Policy provenance is trusted constructor configuration, never request or dependency output.
  - Every audit remains metadata-only and correlation-bound; no prompt, record, answer, evidence identifier, amount, currency, tenant/environment identifier, credential, or provider/customer payload may leak.
  - Scope remains server-derived and cross-tenant or cross-environment retrieval remains atomically denied.
  - Mandatory audit failure prevents response release and replay persistence.
classification_limit: Proven reference implementation only; all identity, retrieval, policy, model, and audit dependencies remain synthetic injected boundaries.
rollback: Preserve the R1 candidate and rejection. Revert this bounded correction before integration or correct forward after integration; never remove policy provenance, weaken audit release, or relax R1 controls.
