acceptance:
  - Original TASK-0001 historical classification and evidence remain byte-for-byte bound and are not overwritten.
  - TASK-0001 is complete and its matrix disposition is ACCEPTED only with a machine-validated closure record.
  - Closure binds remediation task/handoff, implementation and candidate commits, independent review commit and accepted verdict, exact hosted PR head, both successful required checks, inspected validation artifact content/digest/status, protected merge, every acceptance criterion, and dependencies.
  - Missing, forged, stale, nonexistent, wrong-head, wrong-check, wrong-artifact, wrong-merge, matrix/queue-mismatched, and incomplete-dependency evidence fails closed.
  - recovery_freeze remains true; TASK-0002 through TASK-0110 remain blocked; TASK-0112 through TASK-0123 are untouched.
security:
  - This is repository governance only and changes no tenant, authorization, financial, API, contract, migration, or runtime behavior.
  - Offline validation re-verifies repository Git objects and retained artifact content while disclosing that hosted API observations are an inspected immutable snapshot.
  - No secrets, credentials, customer data, or production financial data are retained.
