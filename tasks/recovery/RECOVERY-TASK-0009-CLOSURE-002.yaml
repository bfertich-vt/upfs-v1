acceptance_criteria:
  - Re-signed recovery bundles reject unknown, missing, type-invalid, cross-linked, duplicate, oversized, accessor, proxy, symbol, sparse, and circular data before state assignment.
  - Exact closed validation covers policies, workflows, approval decisions, checkpoints, idempotency stored requests/results, audit records, history records, outbox envelopes and payloads, root objects, maps, and arrays.
  - Recovery failures are atomic, reveal no supplied sensitive value through errors or audit, and a corrected bundle remains recoverable afterward.
  - Valid deterministic export and recovery semantics remain unchanged.
  - Evidence remains explicitly limited to a local in-memory reference implementation.
required_tests:
  - node --test --test-concurrency=1 services/policy-workflow.test.mjs
  - npm test -- --test-concurrency=1
  - npm run format:check
  - npm run lint
  - npm run static:check
  - npm run queue:check
  - npm run traceability:check
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm audit --audit-level=high
  - git fsck --full --strict
security_requirements:
  - Fail closed before mutation on every hostile recovered nested shape.
  - Preserve server-derived tenant/environment isolation and uniform non-disclosure.
  - Permit only bounded metadata schemas in audit, history, idempotency, and outbox records.
  - Do not include attacker-supplied content in recovery errors or generated audit output.
classification_limit: Proven reference implementation only; no production persistence, identity, host wiring, managed infrastructure, or deployment claim.
rollback: Preserve the R1 candidate and QA rejection. Before integration abandon this branch; after integration use a separately reviewed corrective-forward commit or revert without weakening recovery validation.
handoff: docs/handoffs/RECOVERY-TASK-0009-CLOSURE-002.md
