acceptance_criteria:
  - Derived scope is accepted only when its complete own-key set is exactly organization_id, tenant_id, and environment_id as enumerable own data properties on a plain or null-prototype object.
  - Local, global, and well-known Symbol keys; non-enumerable extras; accessors; unexpected string keys; custom prototypes; and throwing or invariant-violating proxy traps fail closed with bounded, non-disclosing responses.
  - Malformed scope is rejected before scanner, record, idempotency, or audit mutation for intake and before record lookup for get.
  - Rejection retains no state and permits a corrected retry using a valid plain or null-prototype scope.
  - Existing authorization, tenant isolation, idempotency, replay, audit, failure, rollback, connector, and registry behavior remains green.
required_tests:
  - node --test services/evidence-intake.test.mjs services/connector-ingestion.test.mjs services/transaction-registry.test.mjs services/registry-generator.test.mjs
