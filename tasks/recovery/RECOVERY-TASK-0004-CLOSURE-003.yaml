security_requirements:
  - Deny malformed authorization-derived scope without revealing tenant or attacker-controlled values.
  - No scanner, record, idempotency, or audit mutation may occur on denial.
  - Preserve tenant isolation and deny-by-default behavior.
rollback: Preserve R1 and R2 rejection history; use a reviewed revert or a separate corrective-forward change without weakening validation.
