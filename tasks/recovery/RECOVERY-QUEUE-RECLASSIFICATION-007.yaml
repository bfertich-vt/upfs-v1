acceptance_criteria:
  - Every one of 110 immutable historical evidence records has a nonempty exact evidence_excerpt that occurs in the cited Git blob whose declared SHA-256 matches; omission, null, empty, fabricated absence phrase, stale digest, or nonmatching excerpt is rejected.
  - Recovery freeze remains validated and blocks only promotion; all queue structural/input/source/acceptance/path/classification/report/production-proof checks remain unconditional.
  - TASK-0021, TASK-0022, and TASK-0109 each contain valid immutable excerpts and truthful unsupported completion classifications.
  - Mutation coverage proves every failure reported by QA c53728 and 3af8a97 fails closed, including omitted excerpt/null-coalescing bypass and EOF formatting check.
  - Candidate handoff is post-implementation, parser-valid, candidate-bound, truthful, and formatting-clean; no product/release claim or historic artifact edit.
required_tests:
  - node --test scripts/queue-validator.test.mjs
  - npm run queue:check
  - npm run validate
  - npm test
  - npm run traceability:check
  - git diff --check
security_requirements:
  - Fail closed on all missing or fabricated immutable evidence and preserve tenant/customer/credential secrecy.
rollback:
  - Revert only independently accepted commits and preserve rejected evidence/history.
runtime_evidence_required: 110 excerpt/hash validations, mutation results, full gates, exact external blockers, handoff provenance, and independent QA/Security report.
