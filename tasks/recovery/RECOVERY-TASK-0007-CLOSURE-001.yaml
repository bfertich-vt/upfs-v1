acceptance_criteria:
  - The workbench uses only the authenticated versioned transaction-search API and never sends tenant scope or accesses storage, providers, models, or privileged APIs directly.
  - Query, limit, and cursor inputs are bounded before network access; continuation retry preserves the exact cursor.
  - Loading, empty, results, more-results, unavailable, forbidden, stale-projection, cancellation, retry, and malformed-response states are deterministic and accessible.
  - Superseded and cancelled requests cannot overwrite current state.
  - Projection or reconciliation mismatch is surfaced without changing or claiming to change PostgreSQL source truth.
  - Observable UI state strips tenant, account, amount, description, and server error payloads to prevent cross-tenant or financial-data leakage.
  - Native keyboard controls, labelled form/table, live status announcements, and visible focus compatibility remain intact.
required_tests:
  - node --test --test-concurrency=1 apps/customer-console/transaction-search-workbench.test.mjs
  - npm run accessibility:check
  - npm test -- --test-concurrency=1
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm run format:check
  - npm run lint
  - npm run queue:check
  - npm run traceability:check
  - npm audit --audit-level=high
  - git fsck --full --strict
security_requirements:
  - Tenant and environment scope remain derived by the authenticated API; no client-supplied scope field is permitted.
  - Forbidden, malformed, stale, and unavailable responses expose only stable generic UI messages.
  - Cancellation and stale-response suppression prevent older data from replacing current authorized results.
  - Rendering and snapshots retain only the minimum safe result fields required by this reference workbench.
classification_limit: Proven reference implementation; no deployed customer console, real API host, OpenSearch, PostgreSQL, production identity, runtime, accessibility certification, or production-operation claim.
rollback: Preserve historical and rejected evidence; use a reviewed revert before integration or a separate corrective-forward commit afterward; never weaken API-only, tenant, leakage, accessibility, or validation controls.
handoff: docs/handoffs/RECOVERY-TASK-0007-CLOSURE-001.md
