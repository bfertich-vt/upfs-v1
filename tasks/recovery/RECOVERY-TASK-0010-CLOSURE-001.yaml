  - npm run format:check
  - npm run lint
  - npm run queue:check
  - npm run traceability:check
  - powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
  - npm audit --audit-level=high
  - git fsck --full --strict
security_requirements:
  - Never trust request tenant or environment identifiers as authorization evidence.
  - No customer financial data, account/transaction/evidence identifiers, credentials, secrets, provider payloads, or private support reason may enter responses, errors, logs, or audits.
  - Hostile objects, proxies, accessors, symbols, sparse arrays, circular graphs, oversize values, and mutation races fail closed before adapter or audit side effects.
  - Mandatory audit failure prevents response release; denied and failed attempts remain metadata-only and auditable.
  - Support sessions cannot be forged, replayed by another actor, widened, transferred, or used after expiry.
classification_limit: Proven reference implementation only; identity, policy, support broker, data repositories, health adapters, audit sink, API host, and persistence are injected local boundaries.
rollback: Preserve historical evidence and any rejected candidates. Before integration abandon this isolated branch; after integration use a reviewed revert or bounded corrective-forward change without weakening authorization, audit, redaction, or closed-shape controls.
