acceptance_criteria:
  - Verified server identity derives actor, tenant, and environment scope; request-provided scope cannot grant access.
  - Read authorization is deny-default and cross-tenant, cross-environment, unknown-resource, and enumeration responses disclose no resource existence.
  - Health and tenant explorer return only bounded, closed, explicitly classified and redacted operational or tenant metadata.
  - Support access is case-bound, reason-bound, independently approved, step-up authenticated, tenant/environment scoped, expiring, non-transferable, and immutably audited.
  - Query limits and endpoint/query/scope-bound cursors are validated without coercion and reject tampering, replay across scope, stale snapshots, and oversized input.
  - Adapter outage, timeout, cancellation, malformed/partial data, concurrent mutation, response shaping, and audit failure fail closed without data release or sensitive leakage.
  - Audit acceptance is atomic before response release and records metadata-only actor/scope/request/decision/support provenance.
  - OpenAPI request, response, error, metadata, pagination, and support-access shapes are closed and remain synchronized with tests.
  - The result is classified only as an in-memory reference implementation; no production identity, persistence, route, infrastructure, or deployment claim is made.
required_tests:
