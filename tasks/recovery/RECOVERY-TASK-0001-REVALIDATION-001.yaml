acceptance_map:
  local_and_pr_validators: scripts/validate.ps1 invokes the repository validator; both workflows run on pull requests; validation executes contract, documentation, test, security, and evidence gates.
  governance: docs/REPOSITORY_GOVERNANCE.md documents required protection and CODEOWNERS controls and distinguishes current enforced controls from missing approval enforcement.
  pinned_tooling: package manifests use exact versions; workflow actions use immutable commit SHAs; Node and Trivy versions and security settings are validated.
  fail_closed_evidence: repository validation writes a passed/failed JSON report; CI rejects failed or missing reports and archives the report.
