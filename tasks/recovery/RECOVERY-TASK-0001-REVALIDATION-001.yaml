  - Fail closed on mutable workflow actions, ranged validator dependencies, missing PR triggers, and missing or failed validation evidence.
  - Do not record credentials, tokens, private payloads, or customer data.
rollback: Correct forward or revert only this candidate after review; never weaken a gate to obtain green status.
independent_review: Required from a separate QA/Security worktree at the exact committed candidate; author must not self-accept.
