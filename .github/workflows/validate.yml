name: validate
on:
  pull_request:
  push:
    branches: [codex/task-0001-baseline]
permissions:
  contents: read
jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Historical provenance tests resolve immutable commits outside the
          # checkout tip, so a shallow clone is not sufficient evidence.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Verify CI gate wiring and immutable action pins
        run: npm run ci:gates
      - name: Run full test suite
        run: npm test
      - name: Formatting gate
        run: npm run format:check
      - name: Lint gate
        run: npm run lint
      - name: Static/type analysis gate
        run: npm run static:check
      - name: Contract drift gate
        run: npm run contracts:check
      - name: Generated drift gate
        run: npm run generated:check
      - name: Migration gate
        run: npm run migration:check
      - name: Tenant-isolation gate
        run: npm run tenant-isolation:check
      - name: Documentation and example gate
        run: npm run documentation:check
      - name: Policy gate
        run: npm run policy:check
      - name: Prompt gate
        run: npm run prompt:check
      - name: Skill gate
        run: npm run skill:check
      - name: Accessibility gate
        run: npm run accessibility:check
      - name: Queue and handoff provenance gate
        run: npm run queue:check
      - name: Provenance gate
        run: npm run provenance:check
      - name: Traceability gate
        run: npm run traceability:check
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Publish validation summary
        shell: pwsh
        run: |
          $report = Get-Content -Raw artifacts/validation-report.json | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Validation report indicates failure.' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Validation evidence'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Status: $($report.status)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Markdown files checked: $($report.metrics.markdown_files)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- JSON contracts checked: $($report.metrics.json_contracts)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- YAML contracts checked: $($report.metrics.yaml_contracts)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Checks'
          foreach ($check in $report.checks) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $($check.name)"
          }
      - name: Archive validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-evidence
          path: artifacts/validation-report.json
          if-no-files-found: error
