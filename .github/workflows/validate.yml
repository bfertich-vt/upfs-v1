name: validate
on:
  pull_request:
  push:
    branches: [codex/task-0001-baseline]
permissions:
  contents: read
jobs:
  repository-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74 # 16.10-bookworm
        env:
          POSTGRES_DB: upfs_ci
          POSTGRES_USER: upfs_ci
          POSTGRES_PASSWORD: upfs-ci-test-only
        options: >-
          --health-cmd "pg_isready -U upfs_ci -d upfs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Historical provenance tests resolve immutable commits outside the
          # checkout tip, so a shallow clone is not sufficient evidence.
          fetch-depth: 0
      - name: Hydrate immutable historical provenance bundle
        # The exact historic handoff candidates and erratum sources that are
        # not in the checkout ancestry are preserved in a repository-local,
        # Git-verified bundle. This is object transport only: it never
        # suppresses provenance validation or contacts a network service.
        run: >-
          git fetch --no-tags scripts/fixtures/historical-provenance-v3.bundle
          'refs/bundle-build/traceability-v3/*:refs/fixtures/traceability-v3/*'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Verify complete immutable provenance hydration
        run: >-
          node --input-type=module -e "import crypto from 'node:crypto'; import
          { execFileSync } from 'node:child_process'; import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('scripts/fixtures/historical-provenance-v3.json'));
          if(m.schema_version!==2||!Array.isArray(m.refs)||!m.required_counts||typeof
          m.required_counts!=='object'||Array.isArray(m.required_counts))throw new
          Error('historical provenance manifest schema mismatch'); const
          allowed=['handoff-candidate','erratum-source','qa-review-evidence']; const
          countKeys=Object.keys(m.required_counts).sort(); const
          requiredKeys=[...allowed,'total'].sort(); if(JSON.stringify(countKeys)!==JSON.stringify(requiredKeys)||
          !allowed.every(k=>Number.isSafeInteger(m.required_counts[k])&&m.required_counts[k]>=0)||
          !Number.isSafeInteger(m.required_counts.total)||m.required_counts.total<0)throw new
          Error('historical provenance required counts schema mismatch'); const
          actual=Object.fromEntries(allowed.map(k=>[k,m.refs.filter(x=>x.kind===k).length]));
          if(m.refs.some(x=>!allowed.includes(x.kind))||m.required_counts.total!==m.refs.length||
          allowed.some(k=>actual[k]!==m.required_counts[k])||m.required_counts['qa-review-evidence']<1)throw
          new Error('historical provenance manifest count mismatch'); const
          d=crypto.createHash('sha256').update(fs.readFileSync(m.bundle)).digest('hex'); if(d!==m.sha256)throw
          new Error('historical provenance bundle digest mismatch'); const
          got=execFileSync('git',['for-each-ref','--format=%(refname):%(objectname)','refs/fixtures/traceability-v3'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const want=m.refs.map(x=>'refs/fixtures/traceability-v3/'+x.kind+'/'+x.commit+':'+x.commit).sort();
          if(JSON.stringify(got)!==JSON.stringify(want))throw new Error('historical provenance refs mismatch');"
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Verify CI gate wiring and immutable action pins
        run: npm run ci:gates
      - name: Run full test suite
        run: npm test
      - name: Formatting gate
        run: npm run format:check
      - name: Lint gate
        run: npm run lint
      - name: Static/type analysis gate
        run: npm run static:check
      - name: Contract drift gate
        run: npm run contracts:check
      - name: Generated drift gate
        run: npm run generated:check
      - name: Migration gate
        run: npm run migration:check
        env:
          UPFS_TEST_DATABASE_URL: postgresql://upfs_ci:upfs-ci-test-only@127.0.0.1:5432/upfs_ci
      - name: Tenant-isolation gate
        run: npm run tenant-isolation:check
      - name: Documentation and example gate
        run: npm run documentation:check
      - name: Policy gate
        run: npm run policy:check
      - name: Prompt gate
        run: npm run prompt:check
      - name: Skill gate
        run: npm run skill:check
      - name: Accessibility gate
        run: npm run accessibility:check
      - name: Queue and handoff provenance gate
        run: npm run queue:check
      - name: Provenance gate
        run: npm run provenance:check
      - name: Traceability gate
        run: npm run traceability:check
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Publish validation summary
        shell: pwsh
        run: |
          $report = Get-Content -Raw artifacts/validation-report.json | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Validation report indicates failure.' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Validation evidence'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Status: $($report.status)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Markdown files checked: $($report.metrics.markdown_files)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- JSON contracts checked: $($report.metrics.json_contracts)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- YAML contracts checked: $($report.metrics.yaml_contracts)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Checks'
          foreach ($check in $report.checks) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $($check.name)"
          }
      - name: Archive validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-evidence
          path: artifacts/validation-report.json
          if-no-files-found: error
