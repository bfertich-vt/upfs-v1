openapi: 3.1.0
info: {title: UPFS Public API, version: 1.0.0, x-upfs-documentation-defaults: {authentication: oauth2, classification: canonical-financial-data, rate_limits: bounded, request_response_schemas: true, errors: structured-envelope, audit_events: required, idempotency: required-for-writes, consistency: read-after-write, sdk_behavior: generated}}
servers: [{url: https://api.example.invalid/v1}]
paths:
  /transactions/search:
    post:
      operationId: searchTransactions
      summary: Search authorized canonical transactions
      security: [{oauth2: [transactions.search]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 500}
                limit: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [request_id, data]
                properties:
                  request_id: {type: string}
                  data:
                    type: array
                    items: {$ref: ../schemas/transaction.schema.json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.invalid/oauth/token
          scopes: {transactions.search: Search transactions}
  responses:
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Not authorized for the tenant-scoped resource}
