openapi: 3.1.0
info: {title: UPFS Administrative API, version: 1.0.0}
paths:
  /admin/v1/organizations:
    post:
      operationId: createOrganization
      security: [{oauth2: [organizations.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind], properties: {kind: {type: string, enum: [organization]}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Organization created}, '401': {description: Authentication required}, '403': {description: Forbidden}, '409': {description: Idempotency conflict}}
  /admin/v1/tenants:
    post:
      operationId: createTenant
      security: [{oauth2: [tenants.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [organization_id], properties: {organization_id: {type: string, format: uuid}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Tenant created}, '401': {description: Authentication required}, '403': {description: Forbidden}}
  /admin/v1/environments:
    post:
      operationId: createEnvironment
      security: [{oauth2: [environments.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [tenant_id], properties: {tenant_id: {type: string, format: uuid}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Environment created}, '401': {description: Authentication required}, '403': {description: Forbidden}}
  /admin/v1/operations:
    post:
      operationId: createAdministrativeOperation
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, tenant_id, reason, dry_run]
              properties:
                type: {type: string}
                tenant_id: {type: string}
                reason: {type: string, minLength: 10}
                change_ticket: {type: string}
                dry_run: {type: boolean}
      responses:
        '202': {description: Governed operation accepted}
