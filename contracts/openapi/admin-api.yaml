openapi: 3.1.0
info: {title: UPFS Administrative API, version: 1.0.0}
paths:
  /admin/v1/health:
    get:
      operationId: readPlatformHealth
      security: [{oauth2: [admin:read]}]
      responses:
        '200': {description: Redacted platform operational health}
        '401': {description: Authentication required}
        '403': {description: Administrative scope required}
  /admin/v1/tenants/{tenant_id}:
    get:
      operationId: readTenantEnvironmentStatus
      security: [{oauth2: [admin:read]}]
      parameters:
        - {in: path, name: tenant_id, required: true, schema: {type: string}}
        - {in: header, name: X-Support-Session, required: false, schema: {type: string}, description: Case-bound expiring support session reference; never grants financial data access}
      responses:
        '200': {description: Redacted tenant and environment operational metadata}
        '401': {description: Authentication required}
        '403': {description: Forbidden or invalid support scope}
        '404': {description: Resource not found}
  /admin/v1/organizations:
    post:
      operationId: createOrganization
      security: [{oauth2: [organizations.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind], properties: {kind: {type: string, enum: [organization]}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Organization created}, '401': {description: Authentication required}, '403': {description: Forbidden}, '409': {description: Idempotency conflict}}
  /admin/v1/tenants:
    get:
      operationId: listTenants
      security: [{oauth2: [admin:read]}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string}}
      responses:
        '200': {description: Bounded redacted tenant metadata}
        '401': {description: Authentication required}
        '403': {description: Administrative scope required}
    post:
      operationId: createTenant
      security: [{oauth2: [tenants.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [organization_id], properties: {organization_id: {type: string, format: uuid}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Tenant created}, '401': {description: Authentication required}, '403': {description: Forbidden}}
  /admin/v1/environments:
    post:
      operationId: createEnvironment
      security: [{oauth2: [environments.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [tenant_id], properties: {tenant_id: {type: string, format: uuid}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Environment created}, '401': {description: Authentication required}, '403': {description: Forbidden}}
  /admin/v1/operations:
    post:
      operationId: createAdministrativeOperation
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, tenant_id, reason, dry_run]
              properties:
                type: {type: string}
                tenant_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
                change_ticket: {type: string}
                dry_run: {type: boolean}
      responses:
        '202': {description: Governed operation accepted}
components:
  schemas:
    MembershipCreateRequest:
      type: object
      required: [tenant_id, member_id, roles]
      properties:
        tenant_id: {type: string, format: uuid}
        member_id: {type: string, minLength: 1}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        status: {type: string, enum: [active, suspended], default: active}
    Membership:
      allOf:
        - {$ref: '#/components/schemas/MembershipCreateRequest'}
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
