openapi: 3.1.0
info: {title: UPFS Administrative API, version: 1.0.0, x-upfs-documentation-defaults: {authentication: oauth2, classification: operational-metadata, rate_limits: bounded, request_response_schemas: true, errors: structured-envelope, audit_events: required, idempotency: required-for-writes, consistency: read-after-write, sdk_behavior: generated}}
paths:
  /admin/v1/health:
    get:
      operationId: readPlatformHealth
      security: [{oauth2: [admin:read]}]
      responses:
        '200': {description: Redacted platform operational health, content: {application/json: {schema: {$ref: '#/components/schemas/HealthResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '499': {$ref: '#/components/responses/Cancelled'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/v1/tenants/{tenant_id}:
    get:
      operationId: readTenantEnvironmentStatus
      security: [{oauth2: [admin:read]}]
      parameters:
        - {in: path, name: tenant_id, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {in: query, name: environment_id, required: false, schema: {type: string, minLength: 1, maxLength: 256}, description: Requested environment; authorization remains derived from verified identity or brokered support scope}
        - {in: header, name: X-Support-Session, required: false, schema: {type: string, minLength: 16, maxLength: 512}, description: Opaque reference resolved by the case-bound expiring support broker; request content is not authorization evidence and never grants financial-data access}
      responses:
        '200': {description: Redacted tenant and environment operational metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TenantDetailResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '499': {$ref: '#/components/responses/Cancelled'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/v1/organizations:
    post:
      operationId: createOrganization
      security: [{oauth2: [organizations.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind], properties: {kind: {type: string, enum: [organization]}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Organization created}, '401': {description: Authentication required}, '403': {description: Forbidden}, '409': {description: Idempotency conflict}}
  /admin/v1/tenants:
    get:
      operationId: listTenants
      security: [{oauth2: [admin:read]}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, minLength: 16, maxLength: 2048}, description: Opaque endpoint-, actor-scope-, and snapshot-bound cursor}
      responses:
        '200': {description: Bounded redacted tenant metadata, content: {application/json: {schema: {$ref: '#/components/schemas/TenantListResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '499': {$ref: '#/components/responses/Cancelled'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      operationId: createTenant
      security: [{oauth2: [tenants.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [organization_id], properties: {organization_id: {type: string, format: uuid}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Tenant created}, '401': {description: Authentication required}, '403': {description: Forbidden}}
  /admin/v1/environments:
    post:
      operationId: createEnvironment
      security: [{oauth2: [environments.write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [tenant_id], properties: {tenant_id: {type: string, format: uuid}, name: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Environment created}, '401': {description: Authentication required}, '403': {description: Forbidden}}
  /admin/v1/operations:
    post:
      operationId: createAdministrativeOperation
      security: [{oauth2: [admin:write]}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, tenant_id, reason, dry_run]
              properties:
                type: {type: string}
                tenant_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
                change_ticket: {type: string}
                dry_run: {type: boolean}
      responses:
        '202': {description: Governed operation accepted}
    get:
      operationId: readOperations
      security: [{oauth2: [admin:read]}]
      responses: {'200': {description: Redacted operational metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '401': {$ref: '#/components/responses/AuthenticationRequired'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /admin/v1/operations/{operation_id}/approve:
    post:
      operationId: approveAdministrativeOperation
      security: [{oauth2: [admin:write]}]
      parameters: [{in: path, name: operation_id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason, dual_control], properties: {reason: {type: string, minLength: 10}, dual_control: {type: boolean, const: true}}}}}}
      responses: {'200': {description: Approval recorded}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/v1/operations/{operation_id}/execute:
    post:
      operationId: executeAdministrativeOperation
      security: [{oauth2: [admin:write]}]
      parameters: [{in: path, name: operation_id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}]
      responses: {'200': {description: Executed operation}, '409': {description: Not approved}, '503': {description: Managed credentials unavailable}}
  /admin/v1/operations/{operation_id}/rollback:
    post:
      operationId: rollbackAdministrativeOperation
      security: [{oauth2: [admin:write]}]
      parameters: [{in: path, name: operation_id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [evidence], properties: {evidence: {type: string, minLength: 10}}}}}}
      responses: {'200': {description: Rollback evidence recorded}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /admin/v1/releases:
    get: {operationId: readReleases, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted release metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/incidents:
    get: {operationId: readIncidents, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted incident metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/audit:
    get: {operationId: readAudit, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted audit metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/data-quality:
    get: {operationId: readDataQuality, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted data quality metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/ingestion:
    get: {operationId: readIngestion, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted ingestion metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/support-access:
    get: {operationId: readSupportAccess, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted support-session metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/canonical-quality:
    get: {operationId: readCanonicalQuality, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted canonical quality metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/search-projections:
    get: {operationId: readSearchProjections, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted search projection metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/redis:
    get: {operationId: readRedisHealth, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted Redis health metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/ai-ops:
    get: {operationId: readAiOperations, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted AI operations metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/security:
    get: {operationId: readSecurity, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted security metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/policy-simulator:
    get: {operationId: readPolicySimulator, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted policy simulation metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/v1/workflows:
    get: {operationId: readWorkflows, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted workflow metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/policies:
    get: {operationId: readPolicies, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted policy metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/compliance:
    get: {operationId: readCompliance, security: [{oauth2: [admin:read]}], responses: {'200': {description: Redacted compliance metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalMetadataResponse'}}}}}}
  /admin/v1/managed-integrations:
    get:
      operationId: readManagedIntegrations
      security: [{oauth2: [admin:read]}]
      parameters:
        - {in: query, name: tenant_id, required: true, schema: {type: string}}
        - {in: query, name: environment_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Redacted managed integration status, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedIntegrationResponse'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Managed provider unavailable}
components:
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AuthenticationRequired: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Forbidden or invalid support session, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Cancelled: {description: Request cancelled before audited response release, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    DependencyUnavailable: {description: Required dependency or mandatory audit unavailable; no protected data released, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, code, details, retryable, docs]
      properties:
        request_id: {type: string, minLength: 1}
        code: {type: string, minLength: 1}
        details: {type: object}
        retryable: {type: boolean}
        docs: {type: string, format: uri}
    Page:
      type: object
      additionalProperties: false
      required: [limit, next_cursor]
      properties:
        limit: {type: integer, minimum: 1, maximum: 100}
        next_cursor: {type: [string, 'null'], description: Opaque endpoint-bound cursor}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, components]
      properties:
        request_id: {type: string}
        status: {type: string, enum: [healthy, degraded]}
        components: {type: object, additionalProperties: {$ref: '#/components/schemas/HealthComponent'}}
    HealthComponent:
      type: object
      additionalProperties: false
      required: [status, observed_at, data_classification]
      properties:
        status: {type: string, enum: [healthy, degraded, unavailable, unknown]}
        observed_at: {type: string, format: date-time}
        data_classification: {type: string, const: operational_metadata}
    TenantMetadata:
      type: object
      additionalProperties: false
      required: [id, name, status, organization_id, data_classification]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string}
        organization_id: {type: string}
        data_classification: {type: string, const: tenant_metadata}
    TenantListResponse:
      type: object
      additionalProperties: false
      required: [request_id, data, page]
      properties:
        request_id: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/TenantMetadata'}}
        page: {$ref: '#/components/schemas/Page'}
    TenantDetailResponse:
      type: object
      additionalProperties: false
      required: [request_id, tenant, environments, projection]
      properties:
        request_id: {type: string}
        tenant: {$ref: '#/components/schemas/TenantMetadata'}
        environments: {type: array, maxItems: 5000, items: {$ref: '#/components/schemas/EnvironmentMetadata'}}
        projection: {$ref: '#/components/schemas/ProjectionMetadata'}
    EnvironmentMetadata:
      type: object
      additionalProperties: false
      required: [id, name, status, tenant_id, data_classification]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        name: {type: string, minLength: 1, maxLength: 256}
        status: {type: string, minLength: 1, maxLength: 256}
        tenant_id: {type: string, minLength: 1, maxLength: 256}
        data_classification: {type: string, const: tenant_metadata}
    ProjectionMetadata:
      type: object
      additionalProperties: false
      required: [status, watermark, indexed_count, data_classification]
      properties:
        status: {type: string, enum: [healthy, degraded, unavailable, unknown]}
        watermark: {type: integer, minimum: 0}
        indexed_count: {type: integer, minimum: 0}
        data_classification: {type: string, const: operational_metadata}
    OperationalMetadataResponse:
      type: object
      required: [data_classification]
      properties:
        data_classification: {type: string, const: operational_metadata}
        status: {type: string}
        observed_at: {type: [string, 'null'], format: date-time}
    ManagedIntegrationResponse:
      type: object
      required: [tenant_id, environment_id, data_classification, observability, deployment, backup]
      properties:
        tenant_id: {type: string}
        environment_id: {type: string}
        data_classification: {type: string, const: operational_metadata}
        observability: {$ref: '#/components/schemas/IntegrationStatus'}
        deployment: {$ref: '#/components/schemas/IntegrationStatus'}
        backup: {$ref: '#/components/schemas/IntegrationStatus'}
    IntegrationStatus:
      type: object
      required: [status, observed_at, data_classification]
      properties:
        status: {type: string}
        observed_at: {type: [string, 'null'], format: date-time}
        data_classification: {type: string, const: operational_metadata}
    MembershipCreateRequest:
      type: object
      required: [tenant_id, member_id, roles]
      properties:
        tenant_id: {type: string, format: uuid}
        member_id: {type: string, minLength: 1}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        status: {type: string, enum: [active, suspended], default: active}
    Membership:
      allOf:
        - {$ref: '#/components/schemas/MembershipCreateRequest'}
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
